<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>과매도 수급 스크리너</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="스크리너" />
<style>
  :root{
    --bg: #0B1220;
    --panel: #121B2E;
    --panel-border: #1E2A42;
    --text: #E7ECF5;
    --text-dim: #7C8AA3;
    --accent: #E8A33D;
    --up: #E5484D;      /* 한국 증시 관례: 상승=빨강 */
    --down: #3B82F6;    /* 하락=파랑 */
    --mono: "SF Mono","JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, "SF Pro Text", "Pretendard", "Apple SD Gothic Neo", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  header{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--panel-border);
    position:sticky; top:0; background:var(--bg); z-index:10;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--accent);
    text-transform:uppercase;
  }
  h1{
    font-size:22px;
    margin:6px 0 2px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .subline{
    font-family:var(--mono);
    font-size:13px;
    color:var(--text-dim);
  }
  .conditions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:14px;
  }
  .chip{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-dim);
    border:1px solid var(--panel-border);
    padding:4px 9px;
    border-radius:20px;
  }
  main{ padding:16px; display:flex; flex-direction:column; gap:12px; }
  .card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:16px;
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .name{ font-size:17px; font-weight:700; }
  .code{ font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-left:6px; }
  .rank{
    font-family:var(--mono);
    font-size:11px;
    color:var(--bg);
    background:var(--accent);
    width:20px; height:20px;
    border-radius:6px;
    display:inline-flex; align-items:center; justify-content:center;
    margin-right:8px;
    font-weight:700;
  }
  .price{ font-family:var(--mono); font-size:15px; color:var(--text); }
  .metrics{
    margin-top:12px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 16px;
  }
  .metric-label{
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:0.06em;
    text-transform:uppercase;
  }
  .metric-value{ font-family:var(--mono); font-size:14px; margin-top:2px; }
  .rsi-bar{
    margin-top:12px;
    height:6px;
    border-radius:3px;
    background:#1A2438;
    position:relative;
    overflow:hidden;
  }
  .rsi-fill{
    position:absolute; left:0; top:0; bottom:0;
    background:linear-gradient(90deg,var(--down),var(--accent));
    border-radius:3px;
  }
  .rsi-mark{
    position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--text-dim);
  }
  .flow-pos{ color:var(--up); }
  .empty{
    padding:60px 20px; text-align:center; color:var(--text-dim); font-family:var(--mono); font-size:13px;
  }
  .updated{
    font-family:var(--mono); font-size:11px; color:var(--text-dim); text-align:center; margin-top:24px;
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Daily Screening &middot; 전일 종가 기준</div>
  <h1>과매도 + 수급 유입 종목</h1>
  <div class="subline" id="baseDate">불러오는 중...</div>
  <div class="conditions">
    <span class="chip">RSI(14) ≤ 30</span>
    <span class="chip">외국인+기관 3일 연속 순매수</span>
    <span class="chip">이격도(20일) 수렴 중</span>
  </div>
</header>
<main id="list">
  <div class="empty">불러오는 중...</div>
</main>
<div class="updated" id="updatedAt"></div>

<script>
async function load() {
  const list = document.getElementById('list');
  try {
    const res = await fetch('results.json', { cache: 'no-store' });
    const data = await res.json();

    document.getElementById('baseDate').textContent =
      formatDate(data.base_date) + ' 기준 · ' + data.count + '개 종목';
    document.getElementById('updatedAt').textContent =
      '업데이트: ' + new Date(data.generated_at).toLocaleString('ko-KR');

    if (!data.stocks || data.stocks.length === 0) {
      list.innerHTML = '<div class="empty">오늘은 조건을 모두 만족하는 종목이 없습니다.</div>';
      return;
    }

    list.innerHTML = data.stocks.map((s, i) => cardHtml(s, i + 1)).join('');
  } catch (e) {
    list.innerHTML = '<div class="empty">데이터를 불러오지 못했습니다.<br>results.json 생성 여부를 확인하세요.</div>';
  }
}

function formatDate(yyyymmdd) {
  if (!yyyymmdd || yyyymmdd.length !== 8) return yyyymmdd;
  return `${yyyymmdd.slice(0,4)}.${yyyymmdd.slice(4,6)}.${yyyymmdd.slice(6,8)}`;
}

function formatShares(v) {
  return (v >= 0 ? '+' : '') + v.toLocaleString() + '주';
}

function cardHtml(s, rank) {
  const rsiPct = Math.min(100, Math.max(0, s.rsi));
  return `
    <div class="card">
      <div class="card-top">
        <div><span class="rank">${rank}</span><span class="name">${s.name}</span><span class="code">${s.code}</span></div>
        <div class="price">${s.close.toLocaleString()}원</div>
      </div>
      <div class="rsi-bar">
        <div class="rsi-fill" style="width:${rsiPct}%"></div>
        <div class="rsi-mark" style="left:30%"></div>
      </div>
      <div class="metrics">
        <div>
          <div class="metric-label">RSI(14)</div>
          <div class="metric-value">${s.rsi}</div>
        </div>
        <div>
          <div class="metric-label">이격도(20)</div>
          <div class="metric-value">${s.disparity}</div>
        </div>
        <div>
          <div class="metric-label">외국인 3일 순매수</div>
          <div class="metric-value flow-pos">${formatShares(s.foreign_net_3d)}</div>
        </div>
        <div>
          <div class="metric-label">기관합계 3일 순매수</div>
          <div class="metric-value flow-pos">${formatShares(s.institution_net_3d)}</div>
        </div>
      </div>
    </div>
  `;
}

load();
</script>
</body>
</html>
